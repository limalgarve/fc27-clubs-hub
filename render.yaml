services:
  - type: web
    name: fc27-clubs-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ADMIN_TOKEN
        generateValue: true
